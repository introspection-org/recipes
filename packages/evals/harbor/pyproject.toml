[project]
name = "introspection-harbor"
version = "0.2.0"
description = "Harbor installed-agent adapter for Introspection Recipes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["harbor[e2b]>=0.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/introspection_harbor"]
