[project]
name = "introspection-harbor"
version = "0.4.1"
description = "Harbor installed-agent adapter for Introspection Recipes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["harbor[e2b]>=0.22.0", "tenacity>=8"]

[project.scripts]
harbor = "harbor.cli.main:app"
hb = "harbor.cli.main:app"
hr = "harbor.cli.main:app"

[dependency-groups]
dev = ["build>=1,<2", "ruff==0.16.5", "twine>=6,<7", "ty==0.0.77"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/introspection_harbor"]
