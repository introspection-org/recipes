[project]
name = "introspection-harbor"
version = "0.1.3"
description = "Harbor installed-agent adapter for Introspection Recipes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["harbor>=0.20.0,<0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/introspection_harbor"]
