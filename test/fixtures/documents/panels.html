<!doctype html>
<html>
  <head>
    <title>Two panels</title>
  </head>
  <body>
    <figure>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="200"
        height="100"
        viewBox="0 0 200 100"
      >
        <rect width="200" height="100" fill="#d97757" />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="300"
        height="150"
        viewBox="0 0 300 150"
      >
        <rect width="300" height="150" fill="#77756e" />
      </svg>
      <figcaption>Cost and time, side by side</figcaption>
    </figure>
  </body>
</html>
