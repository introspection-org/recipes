<!doctype html>
<html>
  <head>
    <title>Hidden</title>
  </head>
  <body>
    <details>
      <summary>Details</summary>
      <svg width="300" height="120" aria-label="Behind a toggle">
        <rect width="300" height="120" fill="#888" />
      </svg>
    </details>
    <svg width="200" height="80" aria-label="Never shown" style="display: none">
      <rect width="200" height="80" fill="#444" />
    </svg>
  </body>
</html>
