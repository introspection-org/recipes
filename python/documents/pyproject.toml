[project]
name = "recipe-documents"
version = "0.1.0"
description = "The one Python environment every documents format's helpers run in, which the host prepares for any Recipe using a Word or PDF format."
requires-python = ">=3.12,<3.15"
dependencies = ["paper-docx>=0.2.1", "pypdfium2==5.14.0", "pillow==13.0.0"]

[project.optional-dependencies]
# Table cells for fee schedules, SLA grids and price tables. Optional: about 41 MB
# installed (pdfminer.six, cryptography, Pillow, cffi). Without it, a PDF read returns text.
tables = ["pdfplumber==0.11.10"]

[tool.uv]
package = false
constraint-dependencies = ["python-docx<0"]
