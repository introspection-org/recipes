name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      train:
        description: Release train to recover
        type: choice
        options:
          - all
          - root
          - channel
          - documents
          - checker
          - evals
        default: all

permissions: {}

# Push runs: newest push to a ref wins — a run superseded by a newer main
# push is cancelled rather than queued behind. workflow_dispatch runs live in
# a separate group (cancel-in-progress: false below), so a manual re-run to
# finish an interrupted release is never cancelled by a concurrent push. Safe
# either way: release-please is idempotent and the npm/crates publish
# steps skip already-published versions.
concurrency:
  group: release-please-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      root_release_created: ${{ steps.root_release.outputs.release_created }}
      slack_channel_release_created: ${{ steps.root_release.outputs['packages/channels/slack--release_created'] }}
      docx_documents_release_created: ${{ steps.root_release.outputs['packages/documents/docx--release_created'] }}
      pdf_documents_release_created: ${{ steps.root_release.outputs['packages/documents/pdf--release_created'] }}
      crate_release_created: ${{ steps.checker_release.outputs['packages/recipe-check--release_created'] }}
      python_release_created: ${{ steps.checker_release.outputs['packages/recipe-check-python--release_created'] }}
      recipe_evals_vitest_release_created: ${{ steps.evals_release.outputs['packages/evals/vitest--release_created'] }}
      recipe_fakes_mcp_release_created: ${{ steps.evals_release.outputs['packages/fakes/mcp--release_created'] }}
      harbor_release_created: ${{ steps.evals_release.outputs['packages/evals/harbor--release_created'] }}
      # A train with separate release PRs can tag each package at a different
      # commit, so each publishes the commit release-please tagged.
      recipe_evals_vitest_release_sha: ${{ steps.evals_release.outputs['packages/evals/vitest--sha'] }}
      recipe_fakes_mcp_release_sha: ${{ steps.evals_release.outputs['packages/fakes/mcp--sha'] }}
      harbor_release_sha: ${{ steps.evals_release.outputs['packages/evals/harbor--sha'] }}
    steps:
      # Each train owns a different manifest. Concurrent release PRs therefore
      # never edit the same version-state file.
      - uses: googleapis/release-please-action@v5
        id: root_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: googleapis/release-please-action@v5
        id: checker_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-checker-config.json
          manifest-file: .release-please-checker-manifest.json

      - uses: googleapis/release-please-action@v5
        id: evals_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-evals-config.json
          manifest-file: .release-please-evals-manifest.json

      # A merged release PR left untagged means release-please skipped it: a
      # grouped root PR whose title lacks the root version merges the manifest
      # without tags or release_created, which silently skips the npm publish
      # jobs; a PR whose title it cannot parse blocks every later release of
      # that train. Either way the workflow would still appear green.
      - name: Verify each train's release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for train in root checker evals; do
            stale_prs="$(
              gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=closed \
                -f per_page=100 \
                --jq '.[]
                  | select(.merged_at != null)
                  | select(any(.labels[]; .name == "autorelease: pending-'"${train}"'"))
                  | "#\(.number) \(.title)"'
            )"
            if [[ -n "$stale_prs" ]]; then
              echo "Merged ${train} release PRs remain untagged:" >&2
              echo "$stale_prs" >&2
              exit 1
            fi
          done

  build-native-tools:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            platform_id: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            platform_id: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            platform: darwin
            arch: arm64
            platform_id: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            platform_id: darwin-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} -p pi-mcp-client

      # Staged by rust target, which is the layout build-mcp-client-packages.mjs
      # reads; the os/cpu mapping lives in packages/mcp-client/npm/targets.json, not in this matrix.
      - name: Stage the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staged/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/mcp-client" "staged/${{ matrix.target }}/"

      # The wildcard must sit at `staged/` so the rust-target directory survives:
      # upload-artifact roots the archive at the least common ancestor of the
      # matched files, so `staged/<target>/*` would upload a bare mcp-client and
      # the assembly step below could not tell the platforms apart.
      - uses: actions/upload-artifact@v7
        with:
          name: native-tools-${{ matrix.platform_id }}
          path: staged/**
          if-no-files-found: error

  publish:
    needs:
      - release-please
      - build-native-tools
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || needs.release-please.outputs.slack_channel_release_created == 'true' || needs.release-please.outputs.docx_documents_release_created == 'true' || needs.release-please.outputs.pdf_documents_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root' || inputs.train == 'channel' || inputs.train == 'documents'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@11

      # test/documents-docx.test.ts builds the docx adapter's locked Python
      # environment (paper-docx) with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm test && pnpm build

      - uses: actions/download-artifact@v8
        if: ${{ needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root')) }}
        with:
          pattern: native-tools-*
          path: native-tool-artifacts

      - name: Assemble the per-platform mcp-client packages
        if: ${{ needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root')) }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          rm -rf packages/mcp-client/npm/artifacts && mkdir -p packages/mcp-client/npm/artifacts
          for artifact in native-tool-artifacts/native-tools-*; do
            # Each artifact holds a <rust-target>/mcp-client tree (see the upload above).
            cp -R "$artifact"/. packages/mcp-client/npm/artifacts/
          done
          find packages/mcp-client/npm/artifacts -maxdepth 2 -type f -print
          node packages/mcp-client/npm/build-mcp-client-packages.mjs "$version" packages/mcp-client/npm/artifacts

      - run: pnpm pack:check

      # `npm publish` authenticates with npm trusted publishing (OIDC) against
      # the publisher configured on each package. NODE_AUTH_TOKEN is deliberately
      # NOT set: an _authToken in .npmrc takes precedence over OIDC and would
      # bypass the trusted publisher. Each package therefore publishes straight
      # to its final tag, because OIDC authenticates `npm publish` and nothing
      # else -- a staged tag would need a stored token to promote, and that is
      # what left `latest` five releases behind.
      - name: Publish
        env:
          ROOT_RELEASE_CREATED: ${{ needs.release-please.outputs.root_release_created }}
          SLACK_CHANNEL_RELEASE_CREATED: ${{ needs.release-please.outputs.slack_channel_release_created }}
          DOCX_DOCUMENTS_RELEASE_CREATED: ${{ needs.release-please.outputs.docx_documents_release_created }}
          PDF_DOCUMENTS_RELEASE_CREATED: ${{ needs.release-please.outputs.pdf_documents_release_created }}
          MANUAL_ROOT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root') }}
          MANUAL_CHANNEL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'channel') }}
          MANUAL_DOCUMENTS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'documents') }}
          NATIVE_BUILD_RESULT: ${{ needs.build-native-tools.result }}
        shell: bash
        run: |
          set -euo pipefail

          publish_root=false
          publish_slack=false
          publish_docx=false
          publish_pdf=false
          if [[ "$ROOT_RELEASE_CREATED" == "true" || "$MANUAL_ROOT_RELEASE" == "true" ]]; then
            publish_root=true
          fi
          if [[ "$SLACK_CHANNEL_RELEASE_CREATED" == "true" || "$MANUAL_CHANNEL_RELEASE" == "true" ]]; then
            publish_slack=true
          fi
          if [[ "$DOCX_DOCUMENTS_RELEASE_CREATED" == "true" || "$MANUAL_DOCUMENTS_RELEASE" == "true" ]]; then
            publish_docx=true
          fi
          if [[ "$PDF_DOCUMENTS_RELEASE_CREATED" == "true" || "$MANUAL_DOCUMENTS_RELEASE" == "true" ]]; then
            publish_pdf=true
          fi

          if [[ "$publish_root" == "true" && "$NATIVE_BUILD_RESULT" != "success" ]]; then
            echo "The root release requires successful native builds." >&2
            exit 1
          fi

          # A republish is refused, so a rerun after a partial failure cannot move
          # the tag by publishing again. Fail loudly rather than leave it behind.
          assert_tagged() {
            local have
            have="$(npm view "$1@$2" version 2>/dev/null || true)"
            if [[ "$have" != "$3" ]]; then
              echo "$1@$2 is '$have', not $3 -- run: npm dist-tag add $1@$3 $2" >&2
              exit 1
            fi
          }

          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          root_tag="latest"
          if [[ "$version" == *-* ]]; then
            root_tag="beta"
          fi

          # Platform packages first, so the optionalDependencies the root
          # manifest names already resolve when it is published.
          if [[ "$publish_root" == "true" ]]; then
            for d in packages/mcp-client/npm/dist/mcp-client-*; do
              platform_name="$(node -p "require('./$d/package.json').name")"
              if npm view "$platform_name@$version" version >/dev/null 2>&1; then
                echo "$platform_name@$version is already published"
                assert_tagged "$platform_name" "$root_tag" "$version"
              else
                npm publish "$d" --access public --tag "$root_tag"
              fi
            done

            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published"
              assert_tagged "$package_name" "$root_tag" "$version"
            else
              pnpm publish --access public --tag "$root_tag" --no-git-checks
            fi
          fi

          # Channel and document adapters peer-depend on @introspection-ai/recipes,
          # so they publish after the root and check the core version they need.
          channel_dirs=()
          if [[ "$publish_slack" == "true" ]]; then
            channel_dirs+=("packages/channels/slack")
          fi
          if [[ "$publish_docx" == "true" ]]; then
            channel_dirs+=("packages/documents/docx")
          fi
          if [[ "$publish_pdf" == "true" ]]; then
            channel_dirs+=("packages/documents/pdf")
          fi

          if [[ "${#channel_dirs[@]}" -gt 0 ]]; then
            for channel_dir in "${channel_dirs[@]}"; do
              channel_name="$(node -p "require('./$channel_dir/package.json').name")"
              channel_version="$(node -p "require('./$channel_dir/package.json').version")"
              channel_tag="latest"
              if [[ "$channel_version" == *-* ]]; then
                channel_tag="beta"
              fi
              core_range="$(node -p "require('./$channel_dir/package.json').peerDependencies?.['@introspection-ai/recipes'] ?? require('./package.json').version")"
              core_is_current_release=false
              if [[ "$core_range" == workspace:* ]]; then
                core_range="$(node -p "require('./package.json').version")"
                if [[ "$publish_root" == "true" ]]; then
                  core_is_current_release=true
                fi
              fi
              if [[ "$core_is_current_release" != "true" ]] && ! npm view "@introspection-ai/recipes@$core_range" version >/dev/null 2>&1; then
                echo "$channel_name@$channel_version requires an unpublished @introspection-ai/recipes version." >&2
                exit 1
              fi
              if npm view "$channel_name@$channel_version" version >/dev/null 2>&1; then
                echo "$channel_name@$channel_version is already published"
                assert_tagged "$channel_name" "$channel_tag" "$channel_version"
              else
                pnpm --filter "$channel_name" publish --access public --tag "$channel_tag" --no-git-checks
              fi
            done
          fi

  publish-crate:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.crate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p introspection-recipe-check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p introspection-recipe-check | sed 's/.*[@#]//')"
          if [[ "$version" == "0.0.0" ]]; then
            echo "introspection-recipe-check has not been prepared by its 0.1.0 release PR"
            exit 1
          fi
          if curl -sfo /dev/null -A "recipes-release (github.com/introspection-org/recipes)" \
            "https://crates.io/api/v1/crates/introspection-recipe-check/${version}"; then
            echo "introspection-recipe-check@${version} is already published"
          else
            cargo publish -p introspection-recipe-check
          fi

  build-python-wheels:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.python_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist --manifest-path packages/recipe-check-python/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-python:
    needs:
      - release-please
      - build-python-wheels
      - publish-crate
    if: ${{ always() && needs.build-python-wheels.result == 'success' && needs.publish-crate.result == 'success' && (needs.release-please.outputs.python_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: uvx --from maturin==1.11.5 maturin sdist --out dist --manifest-path packages/recipe-check-python/Cargo.toml

      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # The eval packages each keep their own npm lockfile, so they publish with
  # npm from their own directory rather than through the pnpm workspace.
  publish-evals-npm:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.recipe_evals_vitest_release_created == 'true' || needs.release-please.outputs.recipe_fakes_mcp_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'evals'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: recipe-evals-vitest
            directory: packages/evals/vitest
            release_created: ${{ needs.release-please.outputs.recipe_evals_vitest_release_created }}
            release_sha: ${{ needs.release-please.outputs.recipe_evals_vitest_release_sha }}
          - package: recipe-fakes-mcp
            directory: packages/fakes/mcp
            release_created: ${{ needs.release-please.outputs.recipe_fakes_mcp_release_created }}
            release_sha: ${{ needs.release-please.outputs.recipe_fakes_mcp_release_sha }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ matrix.package }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      PUBLISH: ${{ matrix.release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'evals')) }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.PUBLISH == 'true' }}
        with:
          ref: ${{ matrix.release_sha || github.sha }}

      - uses: actions/setup-node@v7
        if: ${{ env.PUBLISH == 'true' }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - if: ${{ env.PUBLISH == 'true' }}
        run: npm ci && npm test && npm run build

      - name: Publish
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published"
          else
            npm publish --access public
          fi

  publish-harbor:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.harbor_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'evals'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-publish-harbor
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/evals/harbor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.harbor_release_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: uv sync --locked && uv build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/evals/harbor/dist
          skip-existing: true
