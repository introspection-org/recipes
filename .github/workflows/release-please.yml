name: release-please

on:
  push:
    branches:
      - main
  # Publishes whatever is released but missing from its registry -- the same
  # thing every push run does, without waiting for a push.
  workflow_dispatch:

permissions: {}

# Push runs: newest push to a ref wins — a run superseded by a newer main
# push is cancelled rather than queued behind. workflow_dispatch runs live in
# a separate group (cancel-in-progress: false below), so a manual re-run to
# finish an interrupted release is never cancelled by a concurrent push. Safe
# either way: release-please is idempotent, and the plan job publishes only
# versions their registries lack.
concurrency:
  group: release-please-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Each train owns a different manifest. Concurrent release PRs therefore
      # never edit the same version-state file.
      - uses: googleapis/release-please-action@v5
        id: root_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: googleapis/release-please-action@v5
        id: checker_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-checker-config.json
          manifest-file: .release-please-checker-manifest.json

      # A grouped release PR title must contain the root version. Without it,
      # release-please can merge the manifest update without creating tags or
      # setting release_created, which silently skips the npm publish jobs.
      - name: Verify root release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stale_prs="$(
            gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=closed \
              -f per_page=100 \
              --jq '.[]
                | select(.merged_at != null)
                | select(any(.labels[]; .name == "autorelease: pending-root"))
                | "#\(.number) \(.title)"'
          )"
          if [[ -n "$stale_prs" ]]; then
            echo "Merged root release PRs remain untagged:" >&2
            echo "$stale_prs" >&2
            exit 1
          fi

      # release-please exits successfully when it finds a merged release PR
      # whose title it cannot parse. That leaves the PR untagged and blocks
      # every later checker release while the workflow still appears green.
      - name: Verify checker release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stale_prs="$(
            gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=closed \
              -f per_page=100 \
              --jq '.[]
                | select(.merged_at != null)
                | select(any(.labels[]; .name == "autorelease: pending-checker"))
                | "#\(.number) \(.title)"'
          )"
          if [[ -n "$stale_prs" ]]; then
            echo "Merged checker release PRs remain untagged:" >&2
            echo "$stale_prs" >&2
            exit 1
          fi

  # Publishes what has been released but not published, not just what this run
  # released: a failed publish leaves its tag and manifest version behind, and
  # the next run (push or dispatch) finishes it. Each output is true when that
  # package's manifest version is tagged and missing from its registry; see
  # scripts/release-plan.mjs. Push runs plan after release-please so they see
  # the tags it just cut; dispatch runs skip release-please.
  plan:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      root: ${{ steps.plan.outputs.root }}
      slack: ${{ steps.plan.outputs.slack }}
      docx: ${{ steps.plan.outputs.docx }}
      pdf: ${{ steps.plan.outputs.pdf }}
      google: ${{ steps.plan.outputs.google }}
      microsoft: ${{ steps.plan.outputs.microsoft }}
      search: ${{ steps.plan.outputs.search }}
      issues: ${{ steps.plan.outputs.issues }}
      crate: ${{ steps.plan.outputs.crate }}
      python: ${{ steps.plan.outputs.python }}
      python_wheels: ${{ steps.plan.outputs.python_wheels }}
      npm: ${{ steps.plan.outputs.npm }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: plan
        run: node scripts/release-plan.mjs

  # Jobs below gate on `!cancelled()` rather than the default success(): the
  # skipped release-please job on a dispatch would otherwise skip them too.
  build-native-tools:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.root == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            platform_id: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            platform_id: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            platform: darwin
            arch: arm64
            platform_id: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            platform_id: darwin-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} -p pi-mcp-client

      # Staged by rust target, which is the layout build-mcp-client-packages.mjs
      # reads; the os/cpu mapping lives in packages/mcp-client/npm/targets.json, not in this matrix.
      - name: Stage the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staged/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/mcp-client" "staged/${{ matrix.target }}/"

      # The wildcard must sit at `staged/` so the rust-target directory survives:
      # upload-artifact roots the archive at the least common ancestor of the
      # matched files, so `staged/<target>/*` would upload a bare mcp-client and
      # the assembly step below could not tell the platforms apart.
      - uses: actions/upload-artifact@v7
        with:
          name: native-tools-${{ matrix.platform_id }}
          path: staged/**
          if-no-files-found: error

  publish:
    needs:
      - plan
      - build-native-tools
    if: ${{ !cancelled() && needs.plan.outputs.npm == 'true' }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@11

      # test/documents-docx.test.ts builds the docx adapter's locked Python
      # environment (paper-docx) with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm test && pnpm build

      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.root == 'true' }}
        with:
          pattern: native-tools-*
          path: native-tool-artifacts

      - name: Assemble the per-platform mcp-client packages
        if: ${{ needs.plan.outputs.root == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          rm -rf packages/mcp-client/npm/artifacts && mkdir -p packages/mcp-client/npm/artifacts
          for artifact in native-tool-artifacts/native-tools-*; do
            # Each artifact holds a <rust-target>/mcp-client tree (see the upload above).
            cp -R "$artifact"/. packages/mcp-client/npm/artifacts/
          done
          find packages/mcp-client/npm/artifacts -maxdepth 2 -type f -print
          node packages/mcp-client/npm/build-mcp-client-packages.mjs "$version" packages/mcp-client/npm/artifacts

      - run: pnpm pack:check

      # `npm publish` authenticates with npm trusted publishing (OIDC) against
      # the publisher configured on each package. NODE_AUTH_TOKEN is deliberately
      # NOT set: an _authToken in .npmrc takes precedence over OIDC and would
      # bypass the trusted publisher. Each package therefore publishes straight
      # to its final tag, because OIDC authenticates `npm publish` and nothing
      # else -- a staged tag would need a stored token to promote, and that is
      # what left `latest` five releases behind.
      - name: Publish
        env:
          publish_root: ${{ needs.plan.outputs.root }}
          publish_slack: ${{ needs.plan.outputs.slack }}
          publish_docx: ${{ needs.plan.outputs.docx }}
          publish_pdf: ${{ needs.plan.outputs.pdf }}
          publish_google: ${{ needs.plan.outputs.google }}
          publish_microsoft: ${{ needs.plan.outputs.microsoft }}
          publish_search: ${{ needs.plan.outputs.search }}
          publish_issues: ${{ needs.plan.outputs.issues }}
          NATIVE_BUILD_RESULT: ${{ needs.build-native-tools.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$publish_root" == "true" && "$NATIVE_BUILD_RESULT" != "success" ]]; then
            echo "The root release requires successful native builds." >&2
            exit 1
          fi

          # A republish is refused, so a rerun after a partial failure cannot move
          # the tag by publishing again. Fail loudly rather than leave it behind.
          assert_tagged() {
            local have
            have="$(npm view "$1@$2" version 2>/dev/null || true)"
            if [[ "$have" != "$3" ]]; then
              echo "$1@$2 is '$have', not $3 -- run: npm dist-tag add $1@$3 $2" >&2
              exit 1
            fi
          }

          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          root_tag="latest"
          if [[ "$version" == *-* ]]; then
            root_tag="beta"
          fi

          # Platform packages first, so the optionalDependencies the root
          # manifest names already resolve when it is published.
          if [[ "$publish_root" == "true" ]]; then
            for d in packages/mcp-client/npm/dist/mcp-client-*; do
              platform_name="$(node -p "require('./$d/package.json').name")"
              if npm view "$platform_name@$version" version >/dev/null 2>&1; then
                echo "$platform_name@$version is already published"
                assert_tagged "$platform_name" "$root_tag" "$version"
              else
                npm publish "$d" --access public --tag "$root_tag"
              fi
            done

            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version is already published"
              assert_tagged "$package_name" "$root_tag" "$version"
            else
              pnpm publish --access public --tag "$root_tag" --no-git-checks
            fi
          fi

          # Channel and document adapters peer-depend on @introspection-ai/recipes,
          # so they publish after the root and check the core version they need.
          channel_dirs=()
          if [[ "$publish_slack" == "true" ]]; then
            channel_dirs+=("packages/channels/slack")
          fi
          if [[ "$publish_docx" == "true" ]]; then
            channel_dirs+=("packages/documents/docx")
          fi
          if [[ "$publish_pdf" == "true" ]]; then
            channel_dirs+=("packages/documents/pdf")
          fi
          if [[ "$publish_google" == "true" ]]; then
            channel_dirs+=("packages/productivity/google")
          fi
          if [[ "$publish_microsoft" == "true" ]]; then
            channel_dirs+=("packages/productivity/microsoft")
          fi
          if [[ "$publish_search" == "true" ]]; then
            channel_dirs+=("packages/search")
          fi
          if [[ "$publish_issues" == "true" ]]; then
            channel_dirs+=("packages/issues")
          fi

          if [[ "${#channel_dirs[@]}" -gt 0 ]]; then
            for channel_dir in "${channel_dirs[@]}"; do
              channel_name="$(node -p "require('./$channel_dir/package.json').name")"
              channel_version="$(node -p "require('./$channel_dir/package.json').version")"
              channel_tag="latest"
              if [[ "$channel_version" == *-* ]]; then
                channel_tag="beta"
              fi
              core_range="$(node -p "require('./$channel_dir/package.json').peerDependencies?.['@introspection-ai/recipes'] ?? require('./package.json').version")"
              core_is_current_release=false
              if [[ "$core_range" == workspace:* ]]; then
                core_range="$(node -p "require('./package.json').version")"
                if [[ "$publish_root" == "true" ]]; then
                  core_is_current_release=true
                fi
              fi
              # A recipes version published moments ago takes a while to become
              # visible; wait for it rather than fail the companions behind it.
              core_visible=false
              if [[ "$core_is_current_release" == "true" ]]; then
                core_visible=true
              else
                for attempt in $(seq 1 30); do
                  if npm view "@introspection-ai/recipes@$core_range" version >/dev/null 2>&1; then
                    core_visible=true
                    break
                  fi
                  echo "waiting for @introspection-ai/recipes@$core_range on npm ($attempt/30)"
                  sleep 10
                done
              fi
              if [[ "$core_visible" != "true" ]]; then
                echo "$channel_name@$channel_version requires an unpublished @introspection-ai/recipes version." >&2
                exit 1
              fi
              if npm view "$channel_name@$channel_version" version >/dev/null 2>&1; then
                echo "$channel_name@$channel_version is already published"
                assert_tagged "$channel_name" "$channel_tag" "$channel_version"
              else
                pnpm --filter "$channel_name" publish --access public --tag "$channel_tag" --no-git-checks
              fi
            done
          fi

  publish-crate:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.crate == 'true' }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p introspection-recipe-check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p introspection-recipe-check | sed 's/.*[@#]//')"
          if [[ "$version" == "0.0.0" ]]; then
            echo "introspection-recipe-check has not been prepared by its 0.1.0 release PR"
            exit 1
          fi
          if curl -sfo /dev/null -A "recipes-release (github.com/introspection-org/recipes)" \
            "https://crates.io/api/v1/crates/introspection-recipe-check/${version}"; then
            echo "introspection-recipe-check@${version} is already published"
          else
            cargo publish -p introspection-recipe-check
          fi

  build-python-wheels:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      # One wheel per entry in packages/recipe-check-python/wheels.json, which the
      # plan also reads to tell whether PyPI has every wheel of a version.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.python_wheels) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist --manifest-path packages/recipe-check-python/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Still after the crate, but a crate already on crates.io (publish-crate
  # skipped) no longer blocks a Python release the registry lacks.
  publish-python:
    needs:
      - plan
      - build-python-wheels
      - publish-crate
    if: ${{ !cancelled() && needs.plan.outputs.python == 'true' && needs.build-python-wheels.result == 'success' && (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: uvx --from maturin==1.11.5 maturin sdist --out dist --manifest-path packages/recipe-check-python/Cargo.toml

      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
