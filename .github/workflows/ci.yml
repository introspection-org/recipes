name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm pack:check

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock

      - run: uv sync --project bindings/python --locked

      - run: uv run --project bindings/python --locked ruff format --check bindings/python/python bindings/python/tests

      - run: uv run --project bindings/python --locked ruff check bindings/python/python bindings/python/tests

      - run: uv run --project bindings/python --locked mypy --strict bindings/python/python bindings/python/tests

      - run: uv run --project bindings/python --locked maturin build --release --out dist --manifest-path bindings/python/Cargo.toml

      - run: uv pip install --python bindings/python/.venv/bin/python --reinstall dist/*.whl

      - run: uv run --project bindings/python --no-sync pytest bindings/python/tests

  pi-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Prove the floor the peer range advertises, read from the range itself so
      # a bump cannot leave this job testing a version we no longer support.
      - run: |
          floor="$(node -p "require('./package.json').peerDependencies['@earendil-works/pi-coding-agent'].replace(/[^0-9.]/g, '')")"
          echo "pi floor: $floor"
          pnpm pkg set \
            devDependencies.@earendil-works/pi-agent-core="$floor" \
            devDependencies.@earendil-works/pi-ai="$floor" \
            devDependencies.@earendil-works/pi-coding-agent="$floor" \
            devDependencies.@earendil-works/pi-tui="$floor"
          pnpm install --no-frozen-lockfile

      - run: |
          cargo build -p pi-mcp-client
          MCP_CLIENT_BIN=target/debug/mcp-client node scripts/package-mcp-client.mjs

      - run: pnpm typecheck

      - run: pnpm exec vitest run test/mcp-tools.test.ts test/pi-extension-mcp-tools.test.ts test/child-agent.test.ts

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: cargo test -p pi-mcp-client -p introspection-recipe-check

      - run: cargo build --release -p pi-mcp-client

      - run: cargo build --release -p introspection-recipe-check --bin introspection-recipe-check

      - run: node scripts/package-mcp-client.mjs
        env:
          MCP_CLIENT_PLATFORM: linux
          MCP_CLIENT_ARCH: arm64

      - run: test -x vendor/mcp-client/linux-arm64/mcp-client

  native-validator-portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            platform_id: linux-x64-musl
            target: x86_64-unknown-linux-musl
            is_musl: true
          - os: windows-latest
            platform: win32
            arch: x64
            platform_id: win32-x64
            target: x86_64-pc-windows-msvc
            is_musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install musl linker
        if: ${{ matrix.is_musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }} -p introspection-recipe-check --bin introspection-recipe-check

