name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # test/documents-docx.test.ts and test/documents-pdf.test.ts build the
      # adapters' locked Python environments (paper-docx; pypdfium2, and
      # pdfplumber for the tables extra) with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm pack:check

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check

      # Also enforces the complexity ratchet: [workspace.lints.clippy] in
      # Cargo.toml turns the lints on, clippy.toml holds the thresholds.
      - run: cargo clippy --all-targets -- -D warnings

      # Pinned to an exact release so a new cargo-machete heuristic cannot
      # turn main red overnight; bump it deliberately. A false positive goes
      # in the crate's [package.metadata.cargo-machete] ignored list, with
      # the reason.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete@0.9.2

      - run: cargo machete

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: packages/recipe-check-python/uv.lock

      - run: uv sync --project packages/recipe-check-python --locked

      - run: uv run --project packages/recipe-check-python --locked ruff format --check packages/recipe-check-python/python packages/recipe-check-python/tests

      - run: uv run --project packages/recipe-check-python --locked ruff check packages/recipe-check-python/python packages/recipe-check-python/tests

      - run: uv run --project packages/recipe-check-python --locked mypy --strict packages/recipe-check-python/python packages/recipe-check-python/tests

      - run: uv run --project packages/recipe-check-python --locked maturin build --release --out dist --manifest-path packages/recipe-check-python/Cargo.toml

      - run: uv pip install --python packages/recipe-check-python/.venv/bin/python --reinstall dist/*.whl

      - run: uv run --project packages/recipe-check-python --no-sync pytest packages/recipe-check-python/tests

  pi-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Prove the floor the peer range advertises, read from the range itself so
      # a bump cannot leave this job testing a version we no longer support.
      # Overrides, not devDependencies, so every workspace package (examples/docs
      # declares Pi too) resolves the same single Pi the root source compiles
      # against.
      - run: |
          floor="$(node -p "require('./package.json').peerDependencies['@earendil-works/pi-coding-agent'].split(' ')[0].replace(/[^0-9.]/g, '')")"
          echo "pi floor: $floor"
          pnpm pkg set \
            pnpm.overrides.@earendil-works/pi-agent-core="$floor" \
            pnpm.overrides.@earendil-works/pi-ai="$floor" \
            pnpm.overrides.@earendil-works/pi-coding-agent="$floor" \
            pnpm.overrides.@earendil-works/pi-tui="$floor" \
            pnpm.overrides.@earendil-works/pi-codemode="$floor"
          pnpm install --no-frozen-lockfile

      - run: |
          cargo build -p pi-mcp-client
          MCP_CLIENT_BIN=target/debug/mcp-client node scripts/package-mcp-client.mjs

      - run: pnpm typecheck

      - run: pnpm exec vitest run test/mcp-tools.test.ts test/pi-extension-mcp-tools.test.ts test/child-agent.test.ts

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: cargo test -p pi-mcp-client -p introspection-recipe-check

      - run: cargo build --release -p pi-mcp-client

      - run: cargo build --release -p introspection-recipe-check --bin introspection-recipe-check

      - run: node scripts/package-mcp-client.mjs
        env:
          MCP_CLIENT_PLATFORM: linux
          MCP_CLIENT_ARCH: arm64

      - run: test -x vendor/mcp-client/linux-arm64/mcp-client

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  # Ratchets copy/paste per language: each step fails once that language's
  # duplicated-line share rises above `threshold` in its config, printing every
  # clone. One config per language (TypeScript and JavaScript share one), so a
  # small language's ratchet isn't drowned by the TypeScript line count. The
  # thresholds start at the duplication measured when the job was added. Lower
  # a threshold when a refactor removes duplication; never raise it.
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: TypeScript and JavaScript duplicate code stays under the threshold
        run: npx --yes jscpd@5.4.1 --config .jscpd.js-ts.json
      - name: Rust duplicate code stays under the threshold
        if: ${{ !cancelled() }}
        run: npx --yes jscpd@5.4.1 --config .jscpd.json
      - name: Python duplicate code stays under the threshold
        if: ${{ !cancelled() }}
        run: npx --yes jscpd@5.4.1 --config .jscpd.python.json

  # The one check to require in branch protection: it fails when any job it
  # needs failed, was cancelled, or was skipped. Add every new job to its
  # needs, and to allowed-skips when it has an `if:`.
  all-green:
    name: All green
    if: always()
    needs:
      - ci
      - python-bindings
      - pi-minimum
      - native-linux-arm64
      - lint-actions
      - duplication
      - rust-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check that every needed job passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
