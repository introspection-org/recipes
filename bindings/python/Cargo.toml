[package]
name = "introspection-recipe-check-python"
version = "0.5.0"
edition = "2021"
description = "Python bindings for the I/O-free introspection-recipe-check validation engine"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/recipes"
homepage = "https://pi.recipes"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
introspection-recipe-check = { version = "0.5.0", path = "../../crates/introspection-recipe-check", default-features = false, features = ["schema"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1.0"
