[package]
name = "introspection-recipe-check"
version = "0.5.0"
edition = "2021"
description = "Pure Introspection Recipe validation engine"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/recipes"
homepage = "https://pi.recipes"
readme = "README.md"
keywords = ["recipes", "validation", "lint", "agents"]
categories = ["development-tools"]

[[bin]]
name = "introspection-recipe-check"
path = "src/main.rs"

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
regex = "1.11"
schemars = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.1.0"
url = "2.5"
